name: beehome
description: BeeHome - phan he dich vu, ho so va quan tri cua Y.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web: ^1.1.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.1.3
dev_dependencies:
  flutter_lints: ^6.0.0
  shared_preferences: ^2.3.2
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/images/saigon-living-room.webp
    - assets/images/saigon-reading-corner.webp
    - assets/fonts/worksans/OFL.txt
    - assets/fonts/playfairdisplay/OFL.txt
  fonts:
    - family: Work Sans
      fonts:
        - asset: assets/fonts/worksans/worksans.ttf
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/playfairdisplay/playfairdisplay.ttf
